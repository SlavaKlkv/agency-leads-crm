services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leadroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadroom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
