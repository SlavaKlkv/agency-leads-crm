<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Все лиды">
        <span class="brand-mark">L</span>
        <span>{{ app_name }}</span>
      </a>
      <a class="button button-primary" href="/leads/new">Добавить лид</a>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
