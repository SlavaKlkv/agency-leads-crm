<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=9">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Все лиды">
        <span class="brand-mark">L</span>
        <span>{{ app_name }}</span>
      </a>
      <nav class="topbar-actions" aria-label="Основная навигация">
        <a class="button button-primary" href="/leads/new">Добавить лида</a>
      </nav>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    <script>
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        document.querySelectorAll("details[open]").forEach((dropdown) => {
          dropdown.open = false;
        });
      });
    </script>
  </body>
</html>
